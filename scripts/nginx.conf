# ==============================================================================
# DevAdmin Host Nginx Reverse Proxy Configuration
# Two Subdomains Architecture:
#   1. Frontend SPA: https://devadmin.logicbyroshan.in     -> 127.0.0.1:8107
#   2. Backend API:  https://devadmin-api.logicbyroshan.in -> 127.0.0.1:8108
#
# Installation:
#   sudo cp scripts/nginx.conf /etc/nginx/sites-available/devadmin.conf
#   sudo ln -sf /etc/nginx/sites-available/devadmin.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. DevAdmin Frontend SPA (React / Vite via devadmin-frontend container)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name devadmin.logicbyroshan.in;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8107;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# ------------------------------------------------------------------------------
# 2. DevAdmin Backend REST API (Django / Gunicorn via devadmin-backend container)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name devadmin-api.logicbyroshan.in;

    # Maximum upload size for portfolio project media and documents
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8108;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
