name: DevAdmin CI Pipeline

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  backend-validation:
    name: Backend Tests & Django Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Django Configuration & Migrations
        working-directory: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Run Backend Test Suite
        working-directory: backend
        run: |
          python manage.py test

      - name: Test Static Asset Collection
        working-directory: backend
        run: |
          python manage.py collectstatic --noinput --dry-run

  frontend-validation:
    name: Frontend Dependencies & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Distribution Bundle
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://devadmin-api.logicbyroshan.in
        run: npm run build

  docker-build-validation:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [backend-validation, frontend-validation]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: |
          docker build -t devadmin-backend:ci backend/

      - name: Build Frontend Docker Image
        run: |
          docker build --build-arg VITE_API_BASE_URL=https://devadmin-api.logicbyroshan.in -t devadmin-frontend:ci frontend/
